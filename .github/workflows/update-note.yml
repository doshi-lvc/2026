# note の新着記事をトップページの JOURNAL に自動反映する
# - 毎日 7:00 と 19:00（日本時間）に note の RSS を確認
# - 新しい記事があれば index.html を書き換えてコミット → 公開サイトに反映
# - GitHub の「Actions」タブから手動実行（Run workflow）もできます
name: note 新着記事の自動更新

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST
    - cron: "0 10 * * *"   # 毎日 19:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: note の最新記事を取得して index.html を更新
        env:
          TZ: Asia/Tokyo
        run: ruby tools/update-note.rb

      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "新着記事はありませんでした"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "note の新着記事を反映"
          git push
